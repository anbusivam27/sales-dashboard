<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Performance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#EDF1F8;--card:#fff;--ink:#0F172A;--mut:#64748B;--line:#E6EBF3;--shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(30,41,90,.08);--up:#059669;--dn:#E11D48;--upbg:rgba(5,150,105,.12);--dnbg:rgba(225,29,72,.12);--chip:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070D1A;--card:#101A30;--ink:#E8EEF8;--mut:#8FA0BA;--line:#1D2B47;--shadow:0 10px 30px rgba(0,0,0,.45);--up:#34D399;--dn:#FB7185;--upbg:rgba(52,211,153,.14);--dnbg:rgba(251,113,133,.14);--chip:#101A30}}
:root[data-theme="dark"]{--bg:#070D1A;--card:#101A30;--ink:#E8EEF8;--mut:#8FA0BA;--line:#1D2B47;--shadow:0 10px 30px rgba(0,0,0,.45);--up:#34D399;--dn:#FB7185;--upbg:rgba(52,211,153,.14);--dnbg:rgba(251,113,133,.14);--chip:#101A30}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:relative;overflow:hidden;background:linear-gradient(115deg,#071428 0%,#0E3A66 55%,#0B6E7A 100%);color:#fff;padding:30px 32px 74px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
header::before{content:"";position:absolute;width:420px;height:420px;right:-90px;top:-210px;background:radial-gradient(circle,rgba(45,212,191,.45),transparent 65%)}
header::after{content:"";position:absolute;width:360px;height:360px;left:28%;bottom:-260px;background:radial-gradient(circle,rgba(129,140,248,.4),transparent 65%)}
header>*{position:relative;z-index:1}
.brand{display:flex;gap:14px;align-items:center}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#2DD4BF,#6366F1);display:grid;place-items:center;font-size:24px;box-shadow:0 8px 24px rgba(45,212,191,.35)}
h1{margin:0;font-size:26px;font-weight:750;letter-spacing:-.4px}header p{margin:4px 0 0;font-size:13px;opacity:.75}
.filters{display:flex;gap:10px;flex-wrap:wrap}.filters label{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.8;display:flex;flex-direction:column;gap:5px}
select{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:9px 12px;font-size:13px;min-width:140px;cursor:pointer;transition:.2s}
select:hover{background:rgba(255,255,255,.18)}select option{color:#0F172A}
main{padding:0 32px 20px;max-width:1440px;margin:-50px auto 0;display:grid;gap:18px;position:relative;z-index:2}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi{background:var(--card);border-radius:18px;padding:16px 18px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--c),var(--c2))}
.kpi:hover,.card:hover{transform:translateY(-3px)}
.kpi .top{display:flex;align-items:center;gap:10px}.kpi i{font-style:normal;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 6px 14px -4px var(--c)}
.kpi small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-weight:600}
.kpi b{display:block;font-size:30px;margin:10px 0 8px;letter-spacing:-.8px;font-weight:750}
.kpi .row{display:flex;align-items:center;justify-content:space-between;gap:8px}.sp{width:84px;height:34px}
.pill{font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:99px;white-space:nowrap}.pill.up{color:var(--up);background:var(--upbg)}.pill.dn{color:var(--dn);background:var(--dnbg)}.pill.na{color:var(--mut);background:var(--line)}
.ins{display:flex;gap:10px;flex-wrap:wrap}.chip{background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:12.5px;box-shadow:var(--shadow);color:var(--mut)}.chip b{color:var(--ink);font-weight:650}
.grid{display:grid;gap:18px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);min-width:0;transition:transform .25s}
.card h3{margin:0 0 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}.card h3::before{content:"";width:8px;height:8px;border-radius:3px;background:linear-gradient(135deg,#2DD4BF,#6366F1)}
.card h3 em{font-style:normal;color:var(--mut);font-weight:400;font-size:12px;margin-left:auto}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c5{grid-column:span 5}.c3{grid-column:span 3}
.box{position:relative;height:280px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kpi,.card,.chip{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}.kpi:nth-child(2),.chip:nth-child(2){animation-delay:.06s}.kpi:nth-child(3),.chip:nth-child(3){animation-delay:.12s}.kpi:nth-child(4),.chip:nth-child(4){animation-delay:.18s}.kpi:nth-child(5){animation-delay:.24s}
@media(max-width:900px){.c8,.c4,.c6,.c5,.c3{grid-column:span 12}header{padding:24px 16px 70px}main{padding:0 16px 20px}}
table{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:13px}th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;text-align:right;padding:6px 10px}th:first-child,td:first-child{text-align:left}
td{padding:10px;text-align:right;font-variant-numeric:tabular-nums}td:first-child{border-radius:10px 0 0 10px;font-weight:600}td:last-child{border-radius:0 10px 10px 0}
#cust td{border-bottom:1px solid var(--line)}.rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#2DD4BF,#6366F1);color:#fff;font-size:11px;margin-right:8px}
.scroll{overflow-x:auto}footer{text-align:center;color:var(--mut);font-size:12px;padding:6px 0 22px}
</style></head><body>
<header><div class="brand"><div class="logo">📊</div><div><h1>Sales Performance Dashboard</h1><p id="sub"></p></div></div>
<div class="filters">
<label>Year<select id="fy"></select></label><label>Region<select id="fr"></select></label><label>Category<select id="fc"></select></label></div></header>
<main>
<section class="kpis" id="kpis"></section>
<section class="ins" id="ins"></section>
<section class="grid">
<div class="card c8"><h3>Revenue trend <em id="trendNote"></em></h3><div class="box"><canvas id="trend"></canvas></div></div>
<div class="card c4"><h3>Revenue by category</h3><div class="box"><canvas id="cat"></canvas></div></div>
<div class="card c5"><h3>Top products by gross profit</h3><div class="box"><canvas id="prod"></canvas></div></div>
<div class="card c4"><h3>Revenue by region</h3><div class="box"><canvas id="reg"></canvas></div></div>
<div class="card c3"><h3>Sales reps</h3><div class="box"><canvas id="rep"></canvas></div></div>
<div class="card c6"><h3>Segment × quarter <em>(revenue, heat-shaded)</em></h3><div class="scroll"><table id="mx"></table></div></div>
<div class="card c6"><h3>Top 8 customers</h3><div class="scroll"><table id="cust"></table></div></div>
</section>
<footer>Source: Sales_Data.xlsx · Revenue in ₹ · YoY compares the same months of the prior year</footer>
</main>

 mk("reg",{type:"bar",data:{labels:gr.map(a=>a[0]),datasets:[{data:gr.map(a=>a[1]),backgroundColor:COL,borderRadius:10,borderSkipped:false}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>full(c.raw)}}},scales:{x:{grid:{display:false},ticks:{color:tc()}},y:ax({ticks:{callback:fmt,color:tc()}})}}});
 // reps
 const gs=[...group(cur,x=>R[x[3]],x=>x.rev)].sort((a,b)=>b[1]-a[1]);
 mk("rep",{type:"bar",data:{labels:gs.map(a=>a[0]),datasets:[{data:gs.map(a=>a[1]),backgroundColor:grad("#F59E0B","#FB7185",true),borderRadius:8,borderSkipped:false}]},options:{indexAxis:"y",maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>full(c.raw)}}},scales:{x:ax({ticks:{callback:fmt,color:tc(),maxTicksLimit:4}}),y:{grid:{display:false},ticks:{color:tc()}}}}});
 // matrix
 const segs=[...new Set(C.map(c=>c.seg))].sort(),qs=[1,2,3,4],mm=new Map();
 cur.forEach(x=>{const key=x.c.seg+"|"+(Math.floor(moOf(x[0])/3)+1);mm.set(key,(mm.get(key)||0)+x.rev)});
 const mx=Math.max(1,...mm.values());
 document.getElementById("mx").innerHTML="<tr><th>Segment</th>"+qs.map(q=>`<th>Q${q}</th>`).join("")+"<th>Total</th></tr>"+segs.map(s=>{let t=0;return`<tr><td>${s}</td>`+qs.map(q=>{const v=mm.get(s+"|"+q)||0;t+=v;return`<td style="background:rgba(20,184,166,${(.08+.55*v/mx).toFixed(2)})">${fmt(v)}</td>`}).join("")+`<td><b>${fmt(t)}</b></td></tr>`}).join("");
 // customers
 const gcu=new Map();cur.forEach(x=>{const o=gcu.get(x.c.name)||{rev:0,n:0,cost:0,city:x.c.city};o.rev+=x.rev;o.n++;o.cost+=x.cost;gcu.set(x.c.name,o)});
 const top=[...gcu].sort((a,b)=>b[1].rev-a[1].rev).slice(0,8);
 document.getElementById("cust").innerHTML="<tr><th>Customer</th><th>City</th><th>Orders</th><th>Revenue</th><th>Margin</th></tr>"+top.map(([n,o])=>`<tr><td><span class="rk">${top.findIndex(z=>z[0]==n)+1}</span>${n}</td><td>${o.city}</td><td>${o.n}</td><td>${fmt(o.rev)}</td><td>${pct((o.rev-o.cost)/o.rev)}</td></tr>`).join("");
}
[fy_,fr_,fc_].forEach(e=>e.addEventListener("change",render));matchMedia("(prefers-color-scheme:dark)").addEventListener("change",render);
render();
</script></body></html>
